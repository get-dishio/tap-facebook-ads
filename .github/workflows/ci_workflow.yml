### CI workflow for tap-facebook
### Live API integration tests are disabled until a sandbox account is configured.
### Only lint checks run on PRs. To run integration tests, use workflow_dispatch
### with the required secrets configured in the repository settings.

name: Test tap-facebook

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v6.0.0
    - uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        pipx install poetry
        poetry --version
    - name: Install dependencies
      run: |
        poetry install
    - name: Lint with ruff
      run: |
        poetry run ruff check .

  integration-test:
    # Only runs via workflow_dispatch or when secrets are available
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6.0.0
    - uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        pipx install poetry
        poetry --version
    - name: Install dependencies
      run: |
        poetry install
    - name: Test with pytest
      env:
         TAP_FACEBOOK_ACCESS_TOKEN: ${{ secrets.tap_facebook_access_token }}
         TAP_FACEBOOK_ACCOUNT_ID: ${{ secrets.tap_facebook_account_id }}
      run: |
        poetry run pytest --capture=no
