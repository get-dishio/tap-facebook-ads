[tool.poetry]
name = "meltano-tap-facebook"
version = "0.0.0"
description = "`tap-facebook` is a Singer tap for facebook, built with the Meltano SDK for Singer Taps."
authors = ["Meltano <hello@meltano.com>"]
keywords = [
    "ELT",
    "facebook",
]
license = "Elastic-2.0"
packages = [
    { include = "tap_facebook" },
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
pendulum = ">=3.0,<4.0"
requests = "~=2.32.0"
singer-sdk = ">=0.53,<0.54"
facebook-business = "^25.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.0"
ruff = ">=0.8.0"
singer-sdk = {version = ">=0.53,<0.54", extras = ["testing"]}

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_facebook"

[build-system]
requires = ["poetry-core>=2.0,<3.0", "poetry-dynamic-versioning>=1.10,<2.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.scripts]
# CLI declaration
tap-facebook = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-ads = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-v2 = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-ads-v2 = 'tap_facebook.tap:TapFacebook.cli'

[tool.poetry-dynamic-versioning]
enable = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["ANN101", "DJ", "PD", "D101", "D102"]
select = ["ALL"]

[tool.ruff.flake8-import-conventions]
banned-from = ["typing"]

[tool.ruff.flake8-import-conventions.extend-aliases]
typing = "t"

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN201", "D103", "S101", "PLR2004"]

[tool.ruff.pydocstyle]
convention = "google"
