[tool.poetry]
name = "meltano-tap-facebook"
version = "0.0.0"
description = "`tap-facebook` is a Singer tap for facebook, built with the Meltano SDK for Singer Taps."
authors = ["Meltano <hello@meltano.com>"]
keywords = [
    "ELT",
    "facebook",
]
license = "Elastic-2.0"
packages = [
    { include = "tap_facebook" },
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
backoff = ">=2.0"
pendulum = ">=3.0,<4.0"
requests = "~=2.32.0"
singer-sdk = ">=0.53,<0.54"
facebook-business = "^25.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.0"
ruff = ">=0.8.0"
singer-sdk = {version = ">=0.53,<0.54", extras = ["testing"]}

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_facebook"

[build-system]
requires = ["poetry-core>=2.0,<3.0", "poetry-dynamic-versioning>=1.10,<2.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.scripts]
# CLI declaration
tap-facebook = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-ads = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-v2 = 'tap_facebook.tap:TapFacebook.cli'
tap-facebook-ads-v2 = 'tap_facebook.tap:TapFacebook.cli'

[tool.poetry-dynamic-versioning]
enable = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "DJ", "PD",            # Django, Pandas — not applicable
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # Missing docstrings
    "D205", "D212",        # Docstring formatting
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN401",  # Type annotations
    "PLR2004", "PLW2901", "PLR1704",  # Magic values, loop var overwrite, arg redefine
    "A001",                # Shadowing builtins (id)
    "E501",                # Line too long (handled by formatter)
    "RET504",              # Unnecessary assignment before return
    "SIM118",              # Use key in dict
    "G004",                # f-string in logging
    "TRY003", "TRY300", "TRY301", "TRY400",  # tryceratops — too strict for this codebase
    "EM101", "EM102",      # Exception message formatting
    "ARG002",              # Unused method argument (SDK overrides)
    "BLE001",              # Blind exception catch
    "FBT002",              # Boolean positional arg
    "S113",                # Request without timeout (we handle this)
    "COM812",              # Trailing comma (conflicts with formatter)
    "B019",                # lru_cache on method
    "B007",                # Unused loop variable
    "B905",                # zip without strict
    "C901",                # Function too complex
    "PLR0912", "PLR0915",  # Too many branches/statements
    "PERF203",             # try-except in loop (needed for retry logic)
    "SIM108",              # Ternary operator (readability preference)
    "UP028",               # yield from (readability preference)
]
select = ["ALL"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
typing = "t"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "D103", "S101", "PLR2004"]
"tap_facebook/auth.py" = ["SLF001", "PLR2004", "PTH123", "ANN204"]  # OAuth needs _tap._config access, HotGlue convention
"tap_facebook/client.py" = ["PLC0415"]  # Lazy import to avoid circular dependency

[tool.ruff.lint.pydocstyle]
convention = "google"
